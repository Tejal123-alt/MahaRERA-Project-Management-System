
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RERA Mitra | Projects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">RERA Mitra</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="projects.html">Projects</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Heading -->
    <section class="projects-header">
        <div class="container text-center">
            <h1>Explore RERA Projects</h1>
            <p>Find project information and understand important details.</p>
        </div>
    </section>

    <!-- Search Section -->
    <section class="container search-section">

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <input type="text" id="searchInput"
                       class="form-control search-box"
                       placeholder="Search project by name or status...">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
            <h4>Available Projects</h4>
            <span id="projectCount" class="project-count">Loading...</span>
        </div>

        <!-- API response will be displayed here -->
        <div id="projectContainer" class="row g-4">

        </div>

    </section>

    <!-- Project Details Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalProjectName">
                        Project Details
                    </h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="modalProjectBody">
                </div>

            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container text-center">
            <p> 2026 RERA Mitra. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
